<!doctype html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Translate</title>
<link rel="icon" href="/shared/web/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;1,400;1,600&family=Newsreader:opsz,wght@6..72,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/web/base.css">
<link rel="stylesheet" href="/features/translate/web/translate.css">
</head>
<body>
<dialog class="sidebar" id="history-sidebar" aria-label="History">
  <div class="sidebar-top">
    <button type="button" class="ghost-button icon-button" id="sidebar-close-button" aria-label="Hide history" title="Hide history (⌘\)">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><path d="M9.5 4.5v15"/></svg>
    </button>
  </div>
  <label class="sidebar-search">
    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
    <input id="history-search" type="search" placeholder="Search" aria-label="Search history" autocomplete="off" spellcheck="false">
    <span class="sidebar-search-hint">⌘K</span>
  </label>
  <button type="button" class="sidebar-row" id="new-translation-button">
    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 8.5v7M8.5 12h7"/></svg>
    New translation
  </button>
  <div class="history-scroll">
    <p class="history-status" id="history-status" hidden></p>
    <ol class="history-list" id="history-list"></ol>
  </div>
</dialog>
<div class="shell">
  <header class="masthead">
    <button type="button" class="ghost-button icon-button" id="sidebar-open-button" aria-label="Show history"
            aria-controls="history-sidebar" aria-expanded="false" title="Show history (⌘\)">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><path d="M9.5 4.5v15"/></svg>
    </button>
    <button type="button" class="ghost-button icon-button" id="masthead-new-translation-button" aria-label="New translation" title="New translation">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 8.5v7M8.5 12h7"/></svg>
    </button>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2.5l2.2 6.6 6.8 2.4-6.8 2.4L12 20.5l-2.2-6.6-6.8-2.4 6.8-2.4z"/></svg>
    <span class="wordmark">Claude <span>Translate</span></span>
    <nav class="masthead-nav" aria-label="Pages">
      <a class="masthead-link" href="/" aria-current="page">Translate</a>
      <a class="masthead-link" href="/practice">Practice</a>
    </nav>
  </header>

  <div class="settings-bar" role="toolbar" aria-label="Translation settings">
    <button type="button" class="settings-chip" id="mode-button" popovertarget="mode-menu" aria-haspopup="menu" aria-expanded="false">
      <svg class="chip-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 6.5h14M5 11.5h9M5 16.5h11"/></svg>
      <span id="mode-button-label"></span>
      <svg class="chip-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg>
    </button>
    <button type="button" class="settings-chip" id="model-picker-button" popovertarget="model-menu" aria-haspopup="menu" aria-expanded="false" aria-keyshortcuts="Meta+/">
      <svg class="effort-glyph" id="model-picker-effort-glyph" viewBox="0 0 13 12" aria-hidden="true"></svg>
      <span class="chip-label-full" id="model-picker-label-full"></span><span class="chip-label-short" id="model-picker-label-short"></span>
      <svg class="chip-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg>
    </button>
  </div>

  <main class="workspace">
    <div class="direction-bar" id="direction-bar">
      <div class="bar-half source">
        <div class="direction-label">
          <span class="direction-role">From</span>
          <span class="language-name" id="source-language-name"></span>
          <span class="detected-hint" id="detected-hint" title="Detected automatically">detected</span>
        </div>
        <div class="bar-actions">
          <button type="button" class="ghost-button" id="copy-source-button" title="Copy the source text" aria-label="Copy source" hidden>
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8"/></svg>
          </button>
          <button type="button" class="ghost-button" id="edit-button" title="Edit the source text (available once the translation finishes)" hidden>Edit</button>
          <button type="button" class="ghost-button" id="clear-button" title="Clear text (⌘Z to undo)" hidden>Clear</button>
          <button type="button" class="ghost-button" id="undo-clear-button" title="Bring back the cleared text and its translation (⌘Z)" hidden>Undo</button>
          <button type="button" class="ghost-button" id="cancel-button" title="Cancel the translation (Esc)" hidden>Cancel</button>
          <button type="button" class="primary-button" id="translate-button" title="Translate (⌘↵)" aria-keyshortcuts="Meta+Enter">
            Translate
            <span class="shortcut-hint">⌘↵</span>
          </button>
        </div>
      </div>
      <!-- Between the halves in the DOM so Tab order matches what the eye sees. -->
      <button type="button" class="swap-button" id="swap-button" title="Swap languages (⌘⇧S)" aria-label="Swap languages">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h12l-3.5-3.5M17 17H5l3.5 3.5"/></svg>
      </button>
      <div class="bar-half target">
        <div class="direction-label">
          <span class="direction-role">To</span>
          <span class="language-name" id="target-language-name"></span>
        </div>
        <div class="bar-actions">
          <svg class="run-activity" id="run-activity" viewBox="0 0 24 24" aria-hidden="true" hidden><path fill="currentColor" d="M12 2.5l2.2 6.6 6.8 2.4-6.8 2.4L12 20.5l-2.2-6.6-6.8-2.4 6.8-2.4z"/></svg>
          <span class="footer-note" id="run-info"></span>
          <button type="button" class="ghost-button" id="copy-button" hidden>
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8"/></svg>
            <span class="copy-label">Copy</span>
          </button>
          <button type="button" class="ghost-button" id="practice-button" title="Make exercises on this post's English in Practice" hidden>Practice</button>
        </div>
      </div>
    </div>

    <div class="panes">
      <section class="pane source">
        <textarea class="pane-text" id="source-text" aria-label="Text to translate" placeholder="Paste or type text to translate…" spellcheck="false" autofocus></textarea>
        <div class="pane-footer">
          <span class="footer-note" id="char-count"></span>
        </div>
      </section>

      <section class="pane target" id="target-pane">
        <details class="thinking" id="thinking" lang="en" hidden>
          <summary class="thinking-toggle"><svg class="thinking-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2.5l2.2 6.6 6.8 2.4-6.8 2.4L12 20.5l-2.2-6.6-6.8-2.4 6.8-2.4z"/></svg><span class="thinking-label" id="thinking-label"></span><svg class="thinking-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 6.5l5.5 5.5-5.5 5.5"/></svg></summary>
          <div class="thinking-text" id="thinking-text"></div>
        </details>
        <div class="skeleton" id="skeleton" aria-hidden="true"></div>
        <div class="pane-text is-empty" id="target-text" aria-live="polite" data-placeholder="Translation appears here"></div>
      </section>
    </div>

    <div class="pairs-view" id="pairs-view" aria-live="polite" hidden></div>
  </main>

  <div class="settings-menu" id="mode-menu" popover role="menu" aria-label="Mode"></div>
  <div class="settings-menu" id="model-menu" popover role="menu" aria-label="Model and effort"></div>

  <div class="alert" id="alert" role="alert" popover="manual">
    <svg aria-hidden="true" class="alert-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 2.5 20h19L12 3.5z"/><path d="M12 10v4.5M12 17.5v.01"/></svg>
    <div class="alert-text">
      <div class="alert-title" id="alert-title"></div>
      <div class="alert-body" id="alert-body"></div>
      <div class="alert-detail" id="alert-detail"></div>
    </div>
    <div class="alert-actions">
      <button type="button" class="primary-button" id="alert-action-button"></button>
      <button type="button" class="ghost-button" id="alert-close-button" title="Dismiss" aria-label="Dismiss">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </div>
</div>

<script type="module" src="/features/translate/web/translate.ts"></script>
</body>
</html>
