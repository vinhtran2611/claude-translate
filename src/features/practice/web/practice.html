<!doctype html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practice · Claude Translate</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;1,400;1,600&family=Newsreader:opsz,wght@6..72,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/web/base.css">
<link rel="stylesheet" href="/features/practice/web/practice.css">
</head>
<body>
<dialog class="sidebar" id="history-sidebar" aria-label="History">
  <div class="sidebar-top">
    <button type="button" class="ghost-button icon-button" id="sidebar-close-button" aria-label="Hide history" title="Hide history (⌘\)">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><path d="M9.5 4.5v15"/></svg>
    </button>
  </div>
  <label class="sidebar-search">
    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
    <input id="history-search" type="search" placeholder="Search" aria-label="Search history" autocomplete="off" spellcheck="false">
    <span class="sidebar-search-hint">⌘K</span>
  </label>
  <button type="button" class="sidebar-row" id="new-exercise-button">
    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 8.5v7M8.5 12h7"/></svg>
    <span class="row-label">New exercise</span>
  </button>
  <div class="history-scroll">
    <p class="history-status" id="history-status" hidden></p>
    <ol class="history-list" id="history-list"></ol>
  </div>
</dialog>
<div class="shell">
  <header class="masthead">
    <button type="button" class="ghost-button icon-button" id="sidebar-open-button" aria-label="Show history"
            aria-controls="history-sidebar" aria-expanded="false" title="Show history (⌘\)" hidden>
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><path d="M9.5 4.5v15"/></svg>
    </button>
    <button type="button" class="ghost-button icon-button" id="masthead-new-button" aria-label="New exercise" title="New exercise" hidden>
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 8.5v7M8.5 12h7"/></svg>
    </button>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2.5l2.2 6.6 6.8 2.4-6.8 2.4L12 20.5l-2.2-6.6-6.8-2.4 6.8-2.4z"/></svg>
    <span class="wordmark">Claude <span>Translate</span></span>
    <nav class="masthead-nav" aria-label="Pages">
      <a class="masthead-link" href="/">Translate</a>
      <a class="masthead-link" href="/practice" aria-current="page">Practice</a>
    </nav>
  </header>
  <main class="page" id="main" tabindex="-1"></main>
</div>
<script type="module" src="/features/practice/web/practice.ts"></script>
</body>
</html>
